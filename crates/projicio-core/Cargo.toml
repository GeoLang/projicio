[package]
name = "projicio-core"
description = "Pure-Rust coordinate reference system and map projection engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
crs-definitions = { version = "0.5", default-features = false, features = ["proj4"] }
proj4rs = { version = "0.1.10", default-features = false, features = ["multi-thread", "krovak", "aeqd"] }
thiserror = "2"

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "projections"
harness = false
