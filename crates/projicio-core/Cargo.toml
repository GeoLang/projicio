[package]
name = "projicio-core"
description = "Pure-Rust coordinate reference system and map projection engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["aeqd", "registry"]
# optional because proj4rs-geodesic does not compile on wasm32
aeqd = ["proj4rs/aeqd"]
# embedded EPSG metadata blob, left out of the wasm build to keep it small
registry = ["dep:projicio-epsg-format"]

[dependencies]
crs-definitions = { version = "0.5", default-features = false, features = ["proj4"] }
projicio-epsg-format = { workspace = true, optional = true }
proj4rs = { version = "0.2.0", default-features = false, features = ["multi-thread", "krovak"] }
proj4wkt = { version = "0.1.1", default-features = false }
thiserror = "2"

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "projections"
harness = false
