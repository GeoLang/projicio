# its own workspace root, so `cargo test --all` in projicio never builds PROJ
[workspace]

[package]
name = "gen-epsg-registry"
description = "Generates projicio's embedded EPSG registry from PROJ's proj.db"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
flate2 = "1"
projicio-epsg-format = { path = "../../crates/projicio-epsg-format" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
